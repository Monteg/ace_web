# Production overlay: gamma cluster, namespace acegames-www.
#
# image.tag is deliberately absent. CI passes the commit it just built, so this
# file never has to be edited to ship, and it can never name a tag that has been
# garbage-collected from the registry.

replicaCount: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    # A fresh certificate for both hosts: there is no acegames.io wildcard in
    # this cluster to reuse.
    #
    # The `letsencrypt` issuer solves DNS-01 through Cloudflare, with one token
    # in cert-manager (secret cloudflare-api-token). So this certificate cannot
    # be issued until acegames.io is a zone in that Cloudflare account and the
    # token can write records in it. Until then the ingress answers with the
    # default certificate and the Certificate sits pending — which is harmless
    # while DNS still points at Webflow, and blocking on the day it does not.
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    # Both hosts route to the same pods. The www -> apex 301 is served by the
    # site's own nginx (deploy/nginx/conf.d/default.conf), which is where the
    # rest of public/_redirects lives too.
    - host: acegames.io
      paths:
        - path: /
          pathType: Prefix
    - host: www.acegames.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: acegames-io-tls
      hosts:
        - acegames.io
        - www.acegames.io

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

