# Production overlay: gamma cluster, namespace acegames-www.
#
# image.tag is deliberately absent. CI passes the commit it just built, so this
# file never has to be edited to ship, and it can never name a tag that has been
# garbage-collected from the registry.

replicaCount: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    # A fresh certificate for both hosts. There is no acegames.io wildcard in
    # this cluster to reuse, so ingress-shim issues one; the HTTP-01 challenge
    # reaches the cluster through Cloudflare like any other request.
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    # Both hosts route to the same pods. The www -> apex 301 is served by the
    # site's own nginx (deploy/nginx/conf.d/default.conf), which is where the
    # rest of public/_redirects lives too.
    - host: acegames.io
      paths:
        - path: /
          pathType: Prefix
    - host: www.acegames.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: acegames-io-tls
      hosts:
        - acegames.io
        - www.acegames.io

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi
