name: Publish Google Sheets content

on:
  repository_dispatch:
    types: [ace-content-publish]
  workflow_dispatch:
    inputs:
      snapshot_file_id:
        description: Google Drive snapshot file ID
        required: true
      spreadsheet_id:
        description: Source spreadsheet ID
        required: true
      branch:
        description: Branch to publish
        default: main
        required: true

permissions:
  contents: write

concurrency:
  group: ace-content-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SNAPSHOT_FILE_ID: ${{ github.event.client_payload.snapshot_file_id || inputs.snapshot_file_id }}
      SPREADSHEET_ID: ${{ github.event.client_payload.spreadsheet_id || inputs.spreadsheet_id }}
      TARGET_BRANCH: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
      DEPLOYMENT_URL: ${{ vars.PRODUCTION_URL || 'https://acegames.io' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Import immutable snapshot and changed media
        run: node scripts/content/publish-snapshot.mjs --snapshot-file "$SNAPSHOT_FILE_ID"
      - run: npm run check
      - run: npm run ship

      - name: Commit validated generated content
        run: |
          git config user.name "Ace Games Content Bot"
          git config user.email "content-bot@acegames.io"
          git add content/published content/sheets src/generated src/content/games src/assets/content
          if git diff --cached --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "content: publish Google Sheets snapshot"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Record success in Google Sheet
        if: success()
        run: node scripts/content/report-publish.mjs --spreadsheet "$SPREADSHEET_ID" --status Published --build "$GITHUB_RUN_ID" --url "$DEPLOYMENT_URL"

      - name: Record failure in Google Sheet
        if: failure()
        run: node scripts/content/report-publish.mjs --spreadsheet "$SPREADSHEET_ID" --status Failed --build "$GITHUB_RUN_ID" --error "GitHub Actions publish failed. Open run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
