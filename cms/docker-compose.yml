name: ace-games-cms

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ace_cms}
      POSTGRES_USER: ${POSTGRES_USER:-ace_cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in cms/.env}
    volumes:
      - ./data/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ace_cms} -d ${POSTGRES_DB:-ace_cms}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  directus:
    image: directus/directus:11
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8055:8055"
    volumes:
      - ./data/uploads:/directus/uploads
      - ./extensions:/directus/extensions
    environment:
      KEY: ${DIRECTUS_KEY:?Set DIRECTUS_KEY in cms/.env}
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in cms/.env}
      PUBLIC_URL: ${CMS_URL:-http://localhost:8055}

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-ace_cms}
      DB_USER: ${POSTGRES_USER:-ace_cms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in cms/.env}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?Set DIRECTUS_ADMIN_EMAIL in cms/.env}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD in cms/.env}

      STORAGE_LOCATIONS: primary
      STORAGE_PRIMARY_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PRIMARY_ROOT: /directus/uploads
      STORAGE_PRIMARY_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_PRIMARY_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_PRIMARY_REGION: ${STORAGE_REGION:-auto}
      STORAGE_PRIMARY_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_PRIMARY_SECRET: ${STORAGE_SECRET_KEY:-}

      TELEMETRY: "false"
      WEBSOCKETS_ENABLED: "true"
      DEPLOY_WEBHOOK_URL: ${DEPLOY_WEBHOOK_URL:-}
      DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET:-}
      ACE_TRUSTED_PUBLISHERS: ${ACE_TRUSTED_PUBLISHERS:-}
