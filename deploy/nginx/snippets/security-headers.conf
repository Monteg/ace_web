# The `/*` block of public/_headers, which only Cloudflare Pages reads. On the
# cluster nginx is the only thing between Cloudflare and the files, so the two
# files have to say the same thing. Change one, change the other.
#
# nginx inherits add_header from an outer level ONLY when the inner level has no
# add_header of its own. Every location that sets Cache-Control therefore has to
# include this file again, or it silently ships without security headers.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), clipboard-read=(), clipboard-write=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-src https://cdn.rstars.cc https://adapter-api-demo.rstars.cc; connect-src 'self'" always;
