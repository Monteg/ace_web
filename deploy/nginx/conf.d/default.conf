# Serving rules for the built site.
#
# Two Cloudflare Pages files have to be mirrored here, because Pages is no
# longer what serves this site: public/_headers (see snippets/security-headers)
# and public/_redirects (the five redirects below). Each redirect there fixes
# something the old site broke; dropping one re-breaks it.
#
# astro.config.mjs sets `build.format: 'file'` and `trailingSlash: 'never'`, so
# /games is games.html on disk and /games/ is not a URL this site has.

# www -> apex. Webflow did this for free; Pages did not, and neither does nginx
# without being told. The ingress routes both hosts here.
server {
    listen 8080;
    server_name www.acegames.io;
    return 301 https://acegames.io$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;

    # Keep local redirects relative. Otherwise nginx expands `/games` using
    # the pod-facing listen port and leaks `http://acegames.io:8080/games`
    # through the ingress.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Probes and the ingress reach this by pod IP, so it must not depend on Host.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Pages control files. Inert here, and no reason to serve them.
    location = /_headers  { return 404; }
    location = /_redirects { return 404; }

    # --- public/_redirects, line for line -------------------------------------
    # linked from the footer of all 24 game pages today, returns 404
    location = /utility/style-guide { return 301 /terms-conditions; }
    # served a byte-identical copy of the home page, with no canonical anywhere
    location = /index.html { return 301 /; }
    # 404 today: there was no catalogue page at its own URL
    location = /portfolio  { return 301 /games; }
    location = /portfolio/ { return 301 /games; }

    # trailingSlash: 'never' — fold /foo/ onto /foo rather than serving both.
    location ~ ^(?<no_slash>/.+)/$ {
        return 301 $no_slash$is_args$args;
    }

    # --- the contact form -----------------------------------------------------
    # functions/api/contact.ts is a Cloudflare Pages Function and does NOT run on
    # this cluster. A 404 would swallow a filled-in form; answer instead exactly
    # the way that function answers when it has no inbox configured, which
    # /thanks already has copy for ("The contact form is not connected to an
    # inbox yet") and offers the direct address.
    #
    # Delete this block the day the form gets a real backend.
    location = /api/contact {
        return 303 /thanks?status=error&reason=unconfigured;
    }

    # --- caching, mirroring public/_headers ------------------------------------
    # Hashed filenames, so a year is safe and a purge is never needed for these.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML is revalidated. Cloudflare holds the edge copy and CI purges it after
    # a rollout, so a deploy is visible without waiting for a TTL.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;
}
