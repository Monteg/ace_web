# What the CI pipeline of money.energy/www may do in this cluster.
#
# The GitLab agent grants cluster-admin by default, because a job authenticates
# as the agent itself. `access_as: ci_job` in the agent config swaps that for the
# job's own identity: user gitlab:ci_job:<job id>, in groups gitlab:ci_job,
# gitlab:project:<project id>, gitlab:project_env:<project id>:<env slug> and
# the group equivalents. Binding a namespaced Role to gitlab:project:86013072
# leaves this pipeline able to deploy the website and nothing else.
#
# 86013072 is money.energy/www. If the project is ever moved or recreated, the
# path stays but the id does not: check with
#   glab api projects/money.energy%2Fwww --jq .id
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: acegames-www
rules:
  # helm keeps its release history in secrets; the rest is what the chart makes.
  - apiGroups: [""]
    resources: [secrets, services, serviceaccounts, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # --wait and `rollout status` watch these; nothing here creates a pod directly.
  - apiGroups: [""]
    resources: [pods, pods/log, events, endpoints]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: acegames-www
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: Group
    name: gitlab:project:86013072
    apiGroup: rbac.authorization.k8s.io
---
# Namespaces are cluster-scoped, so a Role cannot cover the one read helm makes
# before it installs. resourceNames keeps this to the single namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: acegames-www-namespace-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [acegames-www]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: acegames-www-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: acegames-www-namespace-reader
subjects:
  - kind: Group
    name: gitlab:project:86013072
    apiGroup: rbac.authorization.k8s.io
